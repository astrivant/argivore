name: Locked Python tools
description: Restore the exact project environment, then reinstall current source metadata.
inputs:
  python:
    description: Supported Python interpreter
    default: '3.15.0'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python }}
    - name: Install packaging tool
      shell: bash
      run: python -m pip install poetry==2.5.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .venv
        key: python-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python }}-${{ hashFiles('poetry.lock', 'pyproject.toml', '.github/actions/setup/action.yml') }}
    - name: Synchronize locked environment
      shell: bash
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      run: poetry sync --with dev
