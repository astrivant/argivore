name: Python distribution
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Derive a release version from the immutable tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/release/version.py "$RELEASE_TAG"
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      # Reproduce the acceptance host: no attrs or source package is installed there.
      - name: Check the distribution from a clean host
        run: |
          python -m venv "$RUNNER_TEMP/argivore-verifier"
          "$RUNNER_TEMP/argivore-verifier/bin/python" scripts/ci/check-distribution.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
