name: Python distribution
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare the version from the source and pipeline
        uses: astrivant/astrivant/.github/actions/artifacts@30d08d7f8fe39f1648162c2a5aa22cd18cdf3132
        with:
          operation: prepare
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      # Reproduce the acceptance host: no attrs or source package is installed there.
      - name: Check the distribution from a clean host
        run: |
          python -m venv "$RUNNER_TEMP/argivore-verifier"
          "$RUNNER_TEMP/argivore-verifier/bin/python" scripts/ci/check-distribution.py dist
      - name: Bind tested archives to their source and pipeline
        uses: astrivant/astrivant/.github/actions/artifacts@30d08d7f8fe39f1648162c2a5aa22cd18cdf3132
        with:
          operation: collect-python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
