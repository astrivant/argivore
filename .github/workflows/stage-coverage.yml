name: Coverage publication
on:
  workflow_call:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coverage-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage
          path: .cache/
      - name: Render measured coverage
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/coverage/coverage-badge.mjs .cache/coverage.json .cache/coverage/badges "$SOURCE_SHA"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/coverage/publish-coverage.mjs`);
            await main({github, context, core});
