name: Python tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.15'
          - os: ubuntu-latest
            python: '3.13.16'
          - os: ubuntu-latest
            python: '3.14.8'
          - os: ubuntu-latest
            python: '3.15.0'
          - os: macos-latest
            python: '3.15.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - run: poetry run pytest -n 2 --cov --cov-report=term-missing --cov-report=json:.cache/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13.16'
        with:
          name: coverage
          path: .cache/coverage.json
          include-hidden-files: true
          if-no-files-found: error
