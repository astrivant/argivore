repository:
  name: argivore
  description: Compose reusable argparse command trees with lazy, typed dispatch.
  homepage: https://pypi.org/project/argivore/
  topics: argparse, python, cli, subcommands, developer-tools
  has_issues: true
  has_wiki: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts: [Required CI]
      enforce_admins: false
      restrictions: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
labels:
  - name: bug
    color: CC0000
    description: Corrects behavior that does not meet the existing contract.
  - name: feature
    color: "336699"
    description: Adds a user-facing or developer-facing capability.
  - name: enhancement
    color: a2eeef
    description: Improves an existing capability.
  - name: refactor
    color: "5319e7"
    description: Restructures implementation while preserving behavior.
  - name: documentation
    color: "0075ca"
    description: Changes guides, reference material or contributor instructions.
  - name: tests
    color: bfd4f2
    description: Adds or improves automated verification.
  - name: ci
    color: 1d76db
    description: Changes build, validation, release or repository automation.
  - name: dependencies
    color: 0366d6
    description: Updates dependencies, tool versions or dependency management.
  - name: maintenance
    color: ededed
    description: Performs routine repository upkeep.
  - name: security
    color: b60205
    description: Addresses a demonstrated security issue or changes a security boundary.
  - name: breaking
    color: d93f0b
    description: Requires consumers to change supported usage.
  - name: performance
    color: f9d0c4
    description: Changes resource use with stated validation.
